priority: 10
strict: false
args:
    - id: Verb
      start: 0
      end: -1
      trigger:
        type: prefix
        value: ""
flags:
    - id: Path
      default: .
      description: the dir holding the project (defaults to the current directory)
    - id: Quiet
      keys:
        - --quiet
        - -q
      type: boolean
      description: Quiets the cli output
category: Middleware
summary: Read --path and --quiet in front of every command
description: |-
    Runs in front of every command line and answers none of them. It reads
    --path into props.Path, the project every action works on, and --quiet,
    which silences the progress channel for the rest of the process. No command
    declares either flag itself.
