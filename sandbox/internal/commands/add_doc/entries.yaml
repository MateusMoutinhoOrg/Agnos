args:
    - description: the doc directory under docs/, nested with / for a sub-doc (e.g. PublicApi/api.AddDoc)
      examples:
        - add-doc HandleReports
      name: name
      required: true
      type: string
category: Documentation
examples:
    - add-doc HandleReports --theme development --description "How a report is written and regenerated"
    - add-doc PublicApi/api.AddDoc --description "The AddDoc action of the sandbox api"
flags:
    - array: true
      description: a theme id of themes.yaml the doc belongs to (repeatable; first-level docs only)
      examples:
        - --theme development --theme cli-usage
      identifiers:
        - --theme
        - -t
      name: theme
      type: string
    - description: the one-line summary every index lists the doc with
      examples:
        - --description "How a report is written and regenerated"
      identifiers:
        - --description
        - -d
      name: description
      required: true
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - add-doc HandleReports --theme development -d "..." --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      examples:
        - add-doc HandleReports --theme development -d "..." -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Scaffold a new doc directory under docs/
identifiers:
    - add-doc
long-description: |-
    Creates docs/<name>/ with a doc.md stub and the props.yaml declaring it,
    then runs build so README.md's index and the parent's Index.md list it.
    A first-level doc needs at least one --theme of themes.yaml; a nested name
    (docs/<Parent>/<Name>) creates a sub-doc, which takes no theme. Refuses to
    overwrite an existing doc.
