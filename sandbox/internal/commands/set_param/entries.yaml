args:
    - description: the query parameter to edit, by the key it is declared under
      examples:
        - set-param page --route list-users --max 50
      name: name
      required: true
      type: string
category: Server System
examples:
    - set-param page --route list-users --type int --min 1 --max 50
flags:
    - description: the route (identifier or package name) the parameter is declared on
      examples:
        - set-param page --route list-users
      identifiers:
        - --route
      name: route
      required: true
      type: string
    - description: the query key it answers to from now on
      examples:
        - set-param page --route list-users --rename cursor
      identifiers:
        - --rename
      name: rename
      type: string
    - description: 'the value type: string, boolean, int or float'
      examples:
        - set-param page --route list-users --type int
      identifiers:
        - --type
      name: type
      type: string
    - description: help text shown for the parameter
      examples:
        - set-param page --route list-users --description 'the page to read'
      identifiers:
        - --description
      name: description
      type: string
    - description: the literal bound when the parameter is absent
      examples:
        - set-param page --route list-users --default 1
      identifiers:
        - --default
      name: default
      type: string
    - description: refuse a request that does not carry the parameter
      examples:
        - set-param tenant --route list-users --required
      identifiers:
        - --required
      name: required
      type: boolean
    - description: collect every occurrence of the key into a []T field
      examples:
        - set-param tag --route list-users --array
      identifiers:
        - --array
      name: array
      type: boolean
    - description: smallest accepted value (int/float only)
      examples:
        - set-param page --route list-users --type int --min 1
      identifiers:
        - --min
      name: min
      type: string
    - description: largest accepted value (int/float only)
      examples:
        - set-param page --route list-users --type int --max 50
      identifiers:
        - --max
      name: max
      type: string
    - array: true
      description: a value the parameter takes, for the docs (repeatable; appended)
      examples:
        - set-param page --route list-users --example 2
      identifiers:
        - --example
      name: example
      type: string
    - array: true
      description: 'a key to take off again: description, examples, default, required, array, min or max (repeatable)'
      examples:
        - set-param page --route list-users --clear max
      identifiers:
        - --clear
      name: clear
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Rewrite one declared query parameter of a route
identifiers:
    - set-param
long-description: 'Rewrites one declared query parameter in place and runs build. It is add-param applied to a declaration that already exists: the keys given are written over the ones there, --clear takes one off, and the result goes through the same constructor — so adding a bound that was forgotten never means removing the parameter and declaring it again.'
