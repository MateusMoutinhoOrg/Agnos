category: Deps System
examples:
    - deps-init
    - deps-init --path ./my-project
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - deps-init --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      examples:
        - deps-init -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Initializes the dependency-injection subsystem for the project
identifiers:
    - deps-init
long-description: |-
    Creates the sandbox/deps and adapters directories and calls build.
    Run this once before using add-dep.
