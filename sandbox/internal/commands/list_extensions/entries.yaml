category: Extensions
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - list-extensions --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Lists the generation mechanics and which are on
identifiers:
    - list-extensions
