args:
    - description: the page, as its path under assets/frontend/ without .html (blog/post; index is the one / answers)
      name: name
      required: true
      type: string
category: Front System
examples:
    - add-page about --title About
    - add-page blog/post
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
    - description: the <title> the scaffolded page carries (defaults to the page name)
      identifiers:
        - --title
      name: title
      type: string
help: Scaffold a new html page under assets/frontend/
identifiers:
    - add-page
long-description: 'Writes assets/frontend/<name>.html, plain html the frontend route serves as soon as it exists: /<name> answers it, and index is the page / answers. A name may carry slashes (blog/post). An existing file is refused. A page is a file and nothing else, so one written by hand or by a bundler is as much a page as one this command scaffolded.'
