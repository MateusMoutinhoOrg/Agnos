category: Server System
help: Rename one route
long-description: 'Moves sandbox/internal/routeslist/<route>/ to sandbox/internal/routeslist/<name>/, rewriting the package clause of every hand-written Go file, and runs build so new.go, entries.go and the server''s route list follow it. A page is refused: remove-page and add-page own its html.'
