args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: add-binding
    - description: the name of the new binding (it becomes one directory under adapters/bindings/)
      end: 1
      id: Name
      required: true
      start: 1
category: Deps
description: Creates adapters/bindings/<name>/binding.yaml as a copy of the standard selection, so it starts filling every field, and build generates its generated.new.go. Point it at another adapter with set-adapter --binding.
examples:
    - add-binding lambda
priority: 100
summary: Declare one further binding
