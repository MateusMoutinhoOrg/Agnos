args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: add-adapter
    - description: the adapter to install from assets/adapter-catalog
      end: 1
      id: Name
      required: true
      start: 1
category: Deps
description: 'Renders assets/adapter-catalog/<adapter> into the project and writes its declaration to adapters/impls/<adapter>/adapter.yaml. The contract it fills has to be installed already. Installing changes no selection: a binding binds one adapter per field, so --binding names the one that switches to it.'
examples:
    - add-adapter reflectsort
    - add-adapter reflectsort --binding lambda
flags:
    - description: the binding that should switch to this adapter (installs only when absent)
      id: Binding
priority: 100
summary: Install one further adapter for a contract the project already has
