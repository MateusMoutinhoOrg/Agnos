args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: set-adapter
    - description: the dep whose field is being filled
      end: 1
      id: Dep
      required: true
      start: 1
    - description: the installed adapter that should fill it
      end: 2
      id: Adapter
      required: true
      start: 2
category: Deps
description: Rewrites one binding.yaml so the named adapter is the one bound for that dep, dropping whichever adapter filled the field before. It is the only editor of that choice.
examples:
    - set-adapter sortdeps reflectsort
    - set-adapter sortdeps reflectsort --binding lambda
flags:
    - description: the binding to change (defaults to standard)
      id: Binding
priority: 100
summary: Change which adapter a binding binds for one dep
