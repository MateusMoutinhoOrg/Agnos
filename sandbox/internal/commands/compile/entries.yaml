category: Core Commands
examples:
    - compile --target linux86
    - compile --target linux86 --target macarm64
    - compile --target all
flags:
    - array: true
      description: a target to cross-compile (repeatable); one of linux86, linuxarm64, linuxi32, mac86, macarm64, windows86, windowsi32, or all
      examples:
        - compile --target linux86 --target windows86
      identifiers:
        - --target
        - -t
      name: target
      required: true
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - compile --target all --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      examples:
        - compile --target all -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Cross-compile the project's binaries into release/
identifiers:
    - compile
long-description: 'Runs build over the project and then cross-compiles its ./cmd/main entrypoint once per --target into release/, with CGO disabled. Repeat --target for several targets, or pass --target all to build every one. Targets and their outputs: linux86 -> linux86.out, linuxarm64 -> linuxarm64.out, linuxi32 -> linuxi32.out, mac86 -> mac86.bin, macarm64 -> macarm64.bin, windows86 -> windows86.exe, windowsi32 -> windowsi32.exe.'
