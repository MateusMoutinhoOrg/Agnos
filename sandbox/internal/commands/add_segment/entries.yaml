args:
    - description: the captured segment's name (omitted when --identifier declares a literal segment)
      examples:
        - add-segment tenant --route create-user
      name: name
      type: string
category: Server System
examples:
    - add-segment --route create-user --identifier /users
    - add-segment tenant --route create-user --description "the tenant the user belongs to"
    - add-segment page --route list-users --type int --min 1
flags:
    - description: the route (identifier or package name) that receives the segment
      examples:
        - add-segment tenant --route create-user
      identifiers:
        - --route
      name: route
      required: true
      type: string
    - description: declare a literal segment instead of a capture, always starting with /
      examples:
        - add-segment --route create-user --identifier /users
      identifiers:
        - --identifier
      name: identifier
      type: string
    - default: string
      description: 'the value type of a captured segment: string, boolean, int or float'
      examples:
        - add-segment page --route list-users --type int
      identifiers:
        - --type
      name: type
      type: string
    - description: help text shown for the captured segment
      examples:
        - add-segment tenant --route create-user --description "the tenant the user belongs to"
      identifiers:
        - --description
      name: description
      type: string
    - array: true
      description: an usage example for the segment (repeatable)
      examples:
        - add-segment tenant --route create-user --example /acme
      identifiers:
        - --example
      name: example
      type: string
    - description: smallest accepted value (int/float only)
      examples:
        - add-segment page --route list-users --type int --min 1
      identifiers:
        - --min
      name: min
      type: string
    - description: largest accepted value (int/float only)
      examples:
        - add-segment page --route list-users --type int --max 100
      identifiers:
        - --max
      name: max
      type: string
    - default: "-1"
      description: zero-based index to insert the segment at (defaults to the end)
      examples:
        - add-segment tenant --route create-user --position 0
      identifiers:
        - --position
      name: position
      type: int
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - add-segment tenant --route create-user --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Add a segment to a route's path
identifiers:
    - add-segment
long-description: Appends one segment to the route's paths and runs build so entries.go and the dispatch arm pick it up. With --identifier the segment is a literal, normalized to start with /; with a name it is a capture, which is always required and becomes an Entries field already converted.
