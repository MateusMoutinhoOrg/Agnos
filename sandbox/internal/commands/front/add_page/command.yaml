args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: add-page
    - description: the page, as its path under assets/front/ without .html (blog/post; index is the one / answers)
      end: 1
      id: Name
      required: true
      start: 1
category: Front
description: 'Writes assets/front/<name>.html, plain html the front route serves as soon as it exists: /<name> answers it, and index is the page / answers. A name may carry slashes (blog/post). An existing file is refused. A page is a file and nothing else, so one written by hand or by a bundler is as much a page as one this command scaffolded.'
examples:
    - add-page about --title About
    - add-page blog/post
flags:
    - description: the <title> the scaffolded page carries (defaults to the page name)
      id: Title
priority: 100
summary: Scaffold a new html page under assets/front/
