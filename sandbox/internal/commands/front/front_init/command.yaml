args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: front-init
category: Front System
examples:
    - front-init
    - front-init --path ./my-project
help: Add the html front layer to the project
long-description: 'Installs the deps the front layer needs — the OpinatedAgnosFront lib, its file layer, among them — and writes, once, the frontend route serving every file of assets/frontend and that tree''s index.html and 404.html. A project with no server layer is given one first: the front is answered over http.'
priority: 100
