args:
    - description: the page to remove
      name: name
      required: true
      type: string
category: Front System
examples:
    - remove-page about
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Remove an html page from assets/frontend/
identifiers:
    - remove-page
long-description: 'Deletes assets/frontend/<name>.html. The name is spelled as add-page spells it: the path under assets/frontend/ without .html.'
