args:
    - description: the dep to install from assets/deplist
      examples:
        - dep-install embeddeps
      name: dep
      required: true
      type: string
category: Dependencies
examples:
    - dep-install embeddeps
    - dep-install embeddeps --path ./my-project
flags:
    - description: the adapter to fill the dep's contract with (defaults to the dep's default-adapter)
      examples:
        - dep-install serverdeps --adapter nethttp
      identifiers:
        - --adapter
      name: adapter
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - dep-install --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      examples:
        - dep-install embeddeps -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Installs an embedded dep into the project
identifiers:
    - dep-install
long-description: |
    Renders every file under assets/deplist/<dep> into the project
    at the path it holds inside that dep, then calls build.
