args:
    - description: the route to edit (identifier or package name)
      examples:
        - set-route create-user --help "Create a user"
      name: route
      required: true
      type: string
category: Server System
examples:
    - set-route create-user --method POST --example "curl -X POST localhost:8080/users"
flags:
    - array: true
      description: an http method the route answers, or ANY for every one (repeatable; replaces the whole list)
      examples:
        - --method GET --method POST
      identifiers:
        - --method
        - -m
      name: method
      type: string
    - description: the Content-Type every response of the route carries
      examples:
        - --response-type text/plain
      identifiers:
        - --response-type
      name: response-type
      type: string
    - description: one-line description of the route
      examples:
        - --help "Create a user"
      identifiers:
        - --help
      name: help
      type: string
    - description: the heading the route is listed under in docs/Routes
      examples:
        - --category Users
      identifiers:
        - --category
      name: category
      type: string
    - description: the paragraph docs/Routes prints under the route
      examples:
        - --long-description "Creates one user under a tenant."
      identifiers:
        - --long-description
      name: long-description
      type: string
    - description: drop the route from docs/Routes, still dispatched
      examples:
        - --hidden
      identifiers:
        - --hidden
      name: hidden
      type: boolean
    - description: list the route again in docs/Routes
      examples:
        - --visible
      identifiers:
        - --visible
      name: visible
      type: boolean
    - description: 'the rung this route runs on when several match one request: lowest first, and a route that answers nothing hands the request on'
      examples:
        - set-route logger --priority 0
      identifiers:
        - --priority
      name: priority
      type: int
    - description: move to one rung below the route named, so it runs first (excludes --priority)
      examples:
        - set-route admin-guard --before admin
      identifiers:
        - --before
      name: before
      type: string
    - description: move to one rung above the route named, so it runs next (excludes --priority)
      examples:
        - set-route fallback --after admin
      identifiers:
        - --after
      name: after
      type: string
    - description: how many segments the request path has to have for the route to run
      examples:
        - set-route get-article --segments 2
      identifiers:
        - --segments
      name: segments
      type: int
    - description: 'when the route runs: before (the chain) or after, once the request has been answered'
      examples:
        - set-route access-log --phase after
      identifiers:
        - --phase
      name: phase
      type: string
    - array: true
      description: 'a key to take off: segments (repeatable)'
      examples:
        - set-route get-article --clear segments
      identifiers:
        - --clear
      name: clear
      type: string
    - array: true
      description: an usage example for the route (repeatable)
      examples:
        - set-route create-user --example 'curl localhost:8080/users'
      identifiers:
        - --example
      name: example
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - set-route --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Rewrite the route-level keys of a route.yaml
identifiers:
    - set-route
long-description: Overwrites methods, response-type, priority, segments, phase, help, category, long-description, hidden and examples on one route. Empty options leave the current value alone; --method replaces the whole list; --example appends; --before and --after place the route one rung from another; --clear takes a key off.
