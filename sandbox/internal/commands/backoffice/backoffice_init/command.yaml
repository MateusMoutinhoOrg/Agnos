args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: backoffice-init
category: Backoffice
description: 'Writes the admin backoffice into the project: the /admin pages (login, home, backoffice users, API tokens), the /api/admin JSON api, the backoffice-client-ip, backoffice-security-headers and backoffice-same-origin middlewares, the backoffice-db database, the add-backoffice-user command and the backoffice-start-server middleware in front of start-server. The server, front and database layers are installed first when any is missing, and so are the catalog deps the backoffice calls into (envdeps, jwtdeps, passworddeps, randdeps, ratelimitdeps, timedeps). Every file it writes is the project''s from then on: a second backoffice-init keeps each one already there. Nothing the project wrote is edited: the backoffice''s part of RouteProps and of api.Config are files of their own. start-server then reads the session secret from <NAME>_BACKOFFICE_SECRET, the project''s name upper-cased (MEUSITE_BACKOFFICE_SECRET for meusite), and generates one for the run when it is unset.'
examples:
    - backoffice-init
    - backoffice-init --path ./my-project
priority: 100
summary: Add the admin backoffice to the project
