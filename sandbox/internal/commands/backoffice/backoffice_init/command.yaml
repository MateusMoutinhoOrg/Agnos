args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: backoffice-init
category: Backoffice System
examples:
    - backoffice-init
    - backoffice-init --path ./my-project
help: Add the admin backoffice to the project
long-description: 'Writes the admin backoffice into the project: the /admin pages (login, home, backoffice users, API tokens), the /api/admin JSON api, the client-ip, security-headers and same-origin middlewares, the backofficedb database, the add-backoffice-user command and the backoffice-server middleware in front of start-server. The server, front and database layers are installed first when any is missing, and so are the catalog deps the backoffice calls into (envdeps, jwtdeps, passworddeps, randdeps, ratelimitdeps, timedeps). Every file it writes is the project''s from then on: a second backoffice-init keeps each one already there. Nothing the project wrote is edited: the backoffice''s part of RouteProps and of api.Config are files of their own. start-server then reads the session secret from <NAME>_SECRET, the project''s name upper-cased (MEUSITE_SECRET for meusite).'
priority: 100
