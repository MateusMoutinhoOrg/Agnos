args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: rebalance-commands
category: Cli System
flags:
    - default: "10"
      description: how many rungs apart two commands land (defaults to 10)
      id: Step
      min: 1
      type: integer
help: Lay the cli chain down again with room between its rungs
priority: 100
