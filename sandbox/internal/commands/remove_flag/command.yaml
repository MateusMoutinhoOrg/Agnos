args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: remove-flag
    - description: the flag name, its id, or one of its keys, e.g. --out
      end: 1
      id: Name
      required: true
      start: 1
category: Cli System
examples:
    - remove-flag output --command exec
    - remove-flag --out --command exec
flags:
    - description: the command (a verb or its package name) that owns the flag
      id: Target
      keys:
        - --command
        - -c
      required: true
help: Remove a flag from a command's command.yaml
long-description: Drops one flag declaration (matched by its name, its id or one of its keys) from sandbox/internal/commands/<command>/command.yaml and runs build so the command's new.go and entries.go follow it.
priority: 100
