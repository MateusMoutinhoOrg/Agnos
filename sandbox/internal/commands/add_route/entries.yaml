args:
    - description: the route name (becomes the directory sandbox/internal/routeslist/<name> and its Go package)
      examples:
        - add-route create-user
      name: name
      required: true
      type: string
category: Server System
examples:
    - add-route create-user --trigger /users --method POST --help "Create a user" --category Users
    - add-route get-article --pattern '/articles/{article:integer}'
    - add-route admin-guard --middleware --trigger /admin
flags:
    - description: what the whole request path is compared against; an equal, prefix or text-prefix trigger is normalized to start with / (defaults to /<name>, or / for a --middleware)
      examples:
        - --trigger /users
      identifiers:
        - --trigger
      name: trigger
      type: string
    - description: 'how the trigger is compared: equal, prefix (the value or anything under it, segment by segment), text-prefix, suffix or regex — or starts-with, ends-with, exact, matches (defaults to equal, or prefix for a --middleware)'
      examples:
        - add-route admin --trigger /admin --trigger-type prefix
      identifiers:
        - --trigger-type
      name: trigger-type
      type: string
    - description: 'invert the trigger: the route runs for every path that does not match it'
      examples:
        - add-route not-api --trigger /api --trigger-type prefix --trigger-negate
      identifiers:
        - --trigger-negate
      name: trigger-negate
      type: boolean
    - description: compare the trigger without regard to case
      examples:
        - add-route admin --trigger /admin --trigger-type prefix --trigger-ignore-case
      identifiers:
        - --trigger-ignore-case
      name: trigger-ignore-case
      type: boolean
    - description: 'the url shape the route answers, compiled into its paths: literal segments, {name}, {name:integer|number|uuid} and a last {*rest}; without {*rest} the segment count is fixed (excludes --trigger and --trigger-type)'
      examples:
        - add-route get-article --pattern '/articles/{article:integer}'
      identifiers:
        - --pattern
      name: pattern
      type: string
    - array: true
      description: 'an http method the route answers: GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, or ANY for every one (repeatable; defaults to GET, or ANY for a --middleware)'
      examples:
        - --method POST
      identifiers:
        - --method
        - -m
      name: method
      type: string
    - description: 'declare a middleware: ANY method, a prefix trigger on / unless --trigger says otherwise, priority 10, and a stub handler that hands the request on'
      examples:
        - add-route admin-guard --middleware --trigger /admin
      identifiers:
        - --middleware
      name: middleware
      type: boolean
    - description: the rung this route runs on when several match one request, lowest first; a route that answers nothing hands the request on (defaults to 100, or 10 for a --middleware)
      examples:
        - add-route logger --middleware --priority 0
      identifiers:
        - --priority
      name: priority
      type: int
    - description: land one rung below the route named, so it runs first (excludes --priority)
      examples:
        - add-route admin-guard --middleware --trigger /admin --before admin
      identifiers:
        - --before
      name: before
      type: string
    - description: land one rung above the route named, so it runs next (excludes --priority)
      examples:
        - add-route fallback --trigger / --trigger-type prefix --after admin
      identifiers:
        - --after
      name: after
      type: string
    - description: 'when the route runs: before (the chain, the default) or after, once the request has been answered and without being able to change the answer'
      examples:
        - add-route access-log --middleware --phase after
      identifiers:
        - --phase
      name: phase
      type: string
    - description: the Content-Type every response of the route carries (defaults to application/json, or text/plain for a --middleware)
      examples:
        - --response-type text/plain
      identifiers:
        - --response-type
      name: response-type
      type: string
    - description: one-line description of the route
      examples:
        - add-route create-user --help 'Create a user'
      identifiers:
        - --help
      name: help
      type: string
    - description: the heading the route is listed under in docs/Routes (defaults to Routes, or Middleware for a --middleware)
      examples:
        - add-route create-user --category Users
      identifiers:
        - --category
      name: category
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - add-route --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Declare a new http route
identifiers:
    - add-route
long-description: Writes sandbox/internal/routeslist/<name>/route.yaml and a stub InternalPureHandler.go, then runs build so the route's new.go (the api.Route that lands in Server.Routes) and entries.go (the Entries its handler is handed) are generated. The paths come from --pattern, or from one path, Route, reading the whole request path against --trigger. A --middleware declines by default and sits in front of the routes on the default rung; --before and --after place a route next to another one. priority and response-type are always written.
