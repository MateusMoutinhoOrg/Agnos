args:
    - description: the route name (becomes the directory sandbox/internal/routeslist/<name> and its Go package)
      examples:
        - add-route create-user
      name: name
      required: true
      type: string
category: Server System
examples:
    - add-route create-user --trigger /users --method POST --help "Create a user" --category Users
flags:
    - description: what the whole request path is compared against; an equal, prefix or regex trigger is normalized to start with / (defaults to /<name>)
      examples:
        - --trigger /users
      identifiers:
        - --trigger
      name: trigger
      type: string
    - description: 'how the trigger is compared against the whole request path: equal, prefix, suffix or regex (defaults to equal)'
      examples:
        - add-route logger --trigger / --trigger-type prefix --help 'logs every request' --category Server
      identifiers:
        - --trigger-type
      name: trigger-type
      type: string
    - array: true
      description: 'an http method the route answers: GET, POST, PUT, PATCH, DELETE, HEAD or OPTIONS (repeatable; defaults to GET)'
      examples:
        - --method POST
      identifiers:
        - --method
        - -m
      name: method
      type: string
    - description: the Content-Type every response of the route carries (defaults to application/json)
      examples:
        - --response-type text/plain
      identifiers:
        - --response-type
      name: response-type
      type: string
    - description: one-line description of the route
      examples:
        - --help "Create a user"
      identifiers:
        - --help
      name: help
      required: true
      type: string
    - description: the heading the route is listed under in docs/Routes
      examples:
        - --category Users
      identifiers:
        - --category
      name: category
      required: true
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - add-route --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
    - default: "0"
      description: 'the rung this route runs on when several match one request: lowest first, and a route that writes no status hands the request on'
      examples:
        - add-route logger --trigger / --trigger-type prefix --priority 0 --help 'logs every request' --category Server
      identifiers:
        - --priority
      name: priority
      type: int
help: Declare a new http route
identifiers:
    - add-route
long-description: Writes sandbox/internal/routeslist/<name>/route.yaml — one path, Route, reading the whole request path against the trigger — and a stub InternalPureHandler.go, then runs build so the route's new.go (the api.Route that lands in Server.Routes) and entries.go (the Entries its handler is handed) are generated. priority and response-type are always written.
