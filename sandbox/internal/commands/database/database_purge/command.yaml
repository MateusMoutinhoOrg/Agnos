args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: database-purge
category: Database
description: 'Removes everything the database asset groups installed, sandbox/internal/databases and docs/Databases whole, and writes database: false. The store contract is left in place: database-init installed it, but a dep, once there, is the project''s — ''agnos remove-dep database'' is what takes it away.'
examples:
    - database-purge
    - database-purge --path ./my-project
priority: 100
summary: Remove the database layer and every declared database
