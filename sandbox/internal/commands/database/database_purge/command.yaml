args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: database-purge
category: Database System
examples:
    - database-purge
    - database-purge --path ./my-project
help: Remove the database layer and every declared database
long-description: 'Removes everything the database asset groups installed, sandbox/internal/databases and docs/Databases whole, and writes sandbox-database: false. The store contract is left in place: database-init installed it, but a dep, once there, is the project''s — ''agnos remove-dep database'' is what takes it away.'
priority: 100
