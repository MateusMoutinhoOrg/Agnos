args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: remove-table
    - description: the table to delete
      end: 1
      id: Name
      required: true
      start: 1
category: Database
description: 'Drops one table from the database''s database.yaml and runs build without compiling: every method spelled after the table goes with it. A table another table still links to is refused — point that link elsewhere first.'
examples:
    - remove-table url --database app-database
flags:
    - description: the database (identifier or package name) the table is declared on
      id: Database
      required: true
priority: 100
summary: Delete one collection from a database
