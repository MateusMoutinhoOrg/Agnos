args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: add-database
    - description: the name of the new database (e.g. app-database)
      end: 1
      id: Name
      required: true
      start: 1
category: Database
description: 'Writes sandbox/internal/databases/<name>/database.yaml and runs build, which generates api.go, new.go and methods.go beside it. A database is born with no tables: ''agnos add-table'' declares the first one.'
examples:
    - add-database app-database --key-prefix app
flags:
    - description: the key prefix every record is written under (defaults to the database's own name)
      id: KeyPrefix
priority: 100
summary: Declare a new database in the project
