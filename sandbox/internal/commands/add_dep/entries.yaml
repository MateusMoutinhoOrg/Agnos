args:
    - description: the dep to install from assets/deplist
      examples:
        - add-dep embeddeps
      name: dep
      required: true
      type: string
category: Deps System
examples:
    - add-dep embeddeps
    - add-dep embeddeps --path ./my-project
flags:
    - description: the adapter to fill the dep's contract with (defaults to the dep's default-adapter)
      examples:
        - add-dep sortdeps --adapter reflectsort
      identifiers:
        - --adapter
      name: adapter
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - add-dep --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      examples:
        - add-dep embeddeps -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
    - description: the name the copied contract takes under sandbox/deps/ (remote deps only; defaults to the last segment of the module path)
      examples:
        - add-dep github.com/user/MathLib@v1.2.0 --as mathlib
      identifiers:
        - --as
      name: as
      type: string
    - description: the available of the remote repo the generated shim builds its sandbox from
      examples:
        - add-dep github.com/user/MathLib@v1.2.0 --remote-available standard
      identifiers:
        - --remote-available
      name: remote-available
      type: string
help: Installs one dep of the embedded catalog into the project
identifiers:
    - add-dep
long-description: Renders the contract of assets/deplist/<dep> and the adapter that fills it, then calls build. The adapter is the dep's default-adapter unless --adapter names another; it is enrolled in every available.
