identifiers: ["dep-remove"]
category: Dependencies
help: Removes an embedded dep from the project
long-description: |
  Removes every file that assets/deplist/<dep> installs into the
  project, then calls build.
examples:
  - "dep-remove embeddeps"
  - "dep-remove embeddeps --path ./my-project"
args:
  - name: dep
    description: the dep to remove from the project
    examples:
      - "dep-remove embeddeps"
    type: string
    required: true
flags:
  - name: path
    identifiers: ["--path"]
    description: the dir holding the project (defaults to the current directory)
    examples:
      - "dep-remove --path ./my-project"
    type: string
    default: "."
  - name: quiet
    identifiers: ["--quiet", "-q"]
    description: Quiets the cli output
    examples:
      - "dep-remove embeddeps -q"
    type: boolean
