# Written once by `agnos build`, then the project's.
# `help` is a command like any other (command.yaml + a generated new.go and
# input.go + handler.go); the only difference is that
# agnos writes all of them, instead of the user writing two.
priority: 100
args:
  - id: Verb
    start: 0
    end: 0
    trigger: { type: equal, value: help }
  - id: Name
    start: 1
    end: -1
    description: The command to describe; omit it to list every command
category: Info
summary: Display help for a command
description: |
  When called without arguments, lists every available command
  grouped by category. When called with a command name, shows
  detailed usage, arguments, flags, and examples for that command.
examples:
  - "help"
  - "help start"
