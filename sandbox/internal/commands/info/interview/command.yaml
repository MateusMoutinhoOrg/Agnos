args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: interview
category: Info
examples:
    - interview
    - interview --path ./my-project
help: 'Guided mode: answer questions instead of typing commands'
long-description: 'The one screen of agnos made for a person rather than for a script: it reads the project you point it at and offers what that project can actually do next — create it, give it a command line, declare a command — one suggested step at a time. Areas you have not turned on stay off the menu until you turn them on. Every answer is a flag or an argument you could have typed, and the command line your answers add up to is shown before anything runs.'
priority: 100
