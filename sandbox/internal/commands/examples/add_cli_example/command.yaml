args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: add-cli-example
    - description: the name of the new example (it becomes one directory under examples/cli/)
      end: 1
      id: Name
      required: true
      start: 1
category: Examples
description: Creates examples/cli/<name>/ with an example.sh stub that already runs and exits 0, then runs build so the example listing of the docs names it. The golden result.yaml is written by the first run-examples, never by hand. Refuses an existing name, and refuses outright in a project with no cli.
examples:
    - add-cli-example start
priority: 100
summary: Scaffold a new example under examples/cli/
