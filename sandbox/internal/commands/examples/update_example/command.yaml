args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: update-example
    - description: the example to update, both sides
      end: 1
      id: Name
      required: true
      start: 1
category: Examples
description: Runs one example by name, both sides, and writes what it produced over its result.yaml instead of comparing against it. Every write prints what it changes first - the paths that entered, left or changed sha, and the old output against the new one - so a golden is never rewritten unread. It is the normal way one golden is refreshed; run-examples --update rewrites the whole suite at once and hides the one that moved for a reason nobody meant.
examples:
    - update-example start
    - update-example add-command --path ./my-project
priority: 100
summary: Rewrite one example's golden with what it produces now
