args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: remove-cli-example
    - description: the example directory under examples/cli/
      end: 1
      id: Name
      required: true
      start: 1
category: Examples
examples:
    - remove-cli-example start
help: Delete an example from examples/cli/
long-description: Deletes examples/cli/<name>/ whole - the example.sh, the golden result.yaml and any TestDir or AssertDir the last run left behind - and runs build so the example listing of the docs is rewritten without it.
priority: 100
