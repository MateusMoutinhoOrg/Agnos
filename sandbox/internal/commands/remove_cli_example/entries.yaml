args:
    - description: the example directory under examples/cli/
      examples:
        - remove-cli-example start
      name: name
      required: true
      type: string
category: Examples
examples:
    - remove-cli-example start
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - remove-cli-example start --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      examples:
        - remove-cli-example start -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Delete an example from examples/cli/
identifiers:
    - remove-cli-example
long-description: Deletes examples/cli/<name>/ whole - the example.sh, the golden result.yaml and any TestDir the last run left behind - and runs build so the example listing of the docs is rewritten without it.
