args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: add-parameter
    - description: the query key or header name it is read under; its Input field is the exported spelling of it
      end: 1
      id: Name
      required: true
      start: 1
category: Server
description: Declares one value a route reads and runs build so the route's new.go and input.go pick it up. It is read under its name from the first of its --source that brings it, converted to its --type and bound to Input.<Name>; a missing --required one is answered 400 before the handler runs, and one with a --trigger only lets the route run when it matches.
examples:
    - add-parameter page --route list-users --type number --default 1
    - add-parameter authorization --route admin --source header --trigger Bearer --trigger-type prefix
flags:
    - description: the route (identifier or package name) that receives the parameter
      id: Route
      required: true
    - default: string
      description: 'the value type: string, integer, number, boolean, datetime, string-array or integer-array (defaults to string)'
      id: Type
    - description: 'where the value is read from, in order: query, header or cookie (repeatable; defaults to query)'
      id: Source
      type: string-array
    - description: answer 400 when no source brings the value (not for booleans or parameters with --default)
      id: Required
      type: boolean
    - description: the literal bound when no source brings the value (cannot be combined with --required)
      id: Default
    - description: what the value has to match for the route to run at all, putting the parameter into what the route matches on
      id: Trigger
    - description: 'how the trigger is compared: equal, prefix, text-prefix, suffix or regex — or starts-with, ends-with, exact, matches (defaults to equal; on a value, prefix and text-prefix are the same)'
      id: TriggerType
    - description: 'invert the trigger: the route runs when the value does not match it'
      id: TriggerNegate
      type: boolean
    - description: compare the trigger without regard to case
      id: TriggerIgnoreCase
      type: boolean
    - description: help text shown for the parameter
      id: Description
    - description: an usage example for the parameter (repeatable)
      id: Example
      type: string-array
    - default: "-1"
      description: zero-based index to insert the parameter at (defaults to the end)
      id: Position
      type: integer
priority: 100
summary: Declare one value a route reads from the query string or the headers
