args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: set-parameter
    - description: the key of the parameter to rewrite
      end: 1
      id: Name
      required: true
      start: 1
category: Server
description: 'Rewrites one entry of the route''s parameters in place and runs build. It is add-parameter applied to a declaration that already exists: the keys given are written over the ones there, --clear takes one off, and the result goes through the same constructor.'
examples:
    - set-parameter page --route list-users --type number --default 1
    - set-parameter token --route admin --source header --clear trigger
flags:
    - description: the route (identifier or package name) that declares the parameter
      id: Route
      required: true
    - description: the key the parameter takes on
      id: Rename
    - description: 'the new value type: string, integer, number, boolean, datetime, string-array or integer-array'
      id: Type
    - description: 'where the value is read from, in order: query, header or cookie (repeatable; replaces the whole list)'
      id: Source
      type: string-array
    - description: answer 400 when no source brings the value
      id: Required
      type: boolean
    - description: the new literal bound when no source brings the value
      id: Default
    - description: the new value the parameter has to match for the route to run
      id: Trigger
    - description: 'the new comparison: equal, prefix, text-prefix, suffix or regex — or starts-with, ends-with, exact, matches'
      id: TriggerType
    - description: invert the trigger (take it off with --clear trigger-negate)
      id: TriggerNegate
      type: boolean
    - description: compare the trigger without regard to case (take it off with --clear trigger-ignore-case)
      id: TriggerIgnoreCase
      type: boolean
    - description: the new help text
      id: Description
    - description: an extra usage example (repeatable)
      id: Example
      type: string-array
    - description: 'a key to take off: description, examples, default, required, trigger, trigger-negate or trigger-ignore-case (repeatable)'
      id: Clear
      type: string-array
priority: 100
summary: Rewrite one entry of a route's parameters
