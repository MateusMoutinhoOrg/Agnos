args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: explain-route
    - description: the http method of the request
      end: 1
      id: Method
      required: true
      start: 1
    - description: the request path, query string included
      end: 2
      id: RequestPath
      required: true
      start: 2
category: Server System
examples:
    - explain-route GET /admin/users --header 'x-token=abc'
flags:
    - description: a header the request carries, as key=value (repeatable)
      id: Header
      type: string-array
    - description: a cookie the request carries, as key=value (repeatable)
      id: Cookie
      type: string-array
help: Show which routes one request reaches, without a server
long-description: Walks the chain the way the generated dispatch does and prints, route by route, whether it runs for the request or why it is skipped — the segment count, a path that is missing, will not convert or fails its trigger, the method, a parameter trigger — and a 400 its binding would answer. What a handler does once it runs is its own code, so the last line says what the request ends on when none answers. Writes nothing.
priority: 100
