args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: server-init
category: Server
description: 'Installs the deps the server layer needs — the OpinionatedAgnosServer lib, its request chain, among them — renders sandbox/internal/server and the built-in health route, and writes the start-server command. A project with no cli layer is given one first: a server needs a command that starts it.'
examples:
    - server-init
    - server-init --path ./my-project
priority: 100
summary: Add the http server layer to the project
