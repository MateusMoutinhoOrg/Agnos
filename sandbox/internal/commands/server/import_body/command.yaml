args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: import-body
    - description: the route (identifier or package name) that receives the schema
      end: 1
      id: Name
      required: true
      start: 1
category: Server
description: 'Reads one example payload and declares a body property for every key it carries, which is add-body-field run once per key. A route that declared no body becomes a json one here. The inference is a starting point: a type per key, the objects and lists around them, and — with --infer-format — the four formats a string may spell. A property already declared is never written over; --replace starts the schema over instead. Every bound after that is set-body-field''s.'
examples:
    - import-body create-user --file payload.json --required --infer-format
flags:
    - description: the example payload itself, as one json document
      id: Json
    - description: a file holding the example payload, read instead of --json
      id: File
    - description: list every key the example carries in its object's required set
      id: Required
      type: boolean
    - description: start the schema over instead of adding to the one declared
      id: Replace
      type: boolean
    - description: read an email, a uuid, a date-time or a uri back as the format it spells
      id: InferFormat
      type: boolean
priority: 100
summary: Infer a route's body json- or form-schema from an example payload
