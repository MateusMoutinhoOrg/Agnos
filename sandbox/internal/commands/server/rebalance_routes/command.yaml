args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: rebalance-routes
category: Server System
flags:
    - default: "10"
      description: how many rungs apart two routes land (defaults to 10)
      id: Step
      type: integer
help: Lay the chain down again with room between its rungs
long-description: Gives every route a priority of its own, --step apart, in the order the chain runs them now, so --before and --after have room again. The generated health route keeps its rung.
priority: 100
