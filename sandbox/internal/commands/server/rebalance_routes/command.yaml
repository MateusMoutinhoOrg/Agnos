args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: rebalance-routes
category: Server
description: Gives every route a priority of its own, --step apart, in the order the chain runs them now, so --before and --after have room again. The generated health and openapi routes keep their rung.
flags:
    - default: "10"
      description: how many rungs apart two routes land (defaults to 10)
      id: Step
      type: integer
priority: 100
summary: Lay the chain down again with room between its rungs
