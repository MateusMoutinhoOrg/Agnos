args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: remove-path
    - description: the id of the path to drop (its Input field)
      end: 1
      id: Name
      required: true
      start: 1
category: Server
description: 'Drops one entry of the route''s paths, the exact inverse of add-path, refusing the last one. The build renders only: dropping a path may leave hand-written code reading an Input field that is gone.'
examples:
    - remove-path tenant --route create-user
flags:
    - description: the route (identifier or package name) that declares the path
      id: Route
      required: true
priority: 100
summary: Delete one entry of a route's paths
