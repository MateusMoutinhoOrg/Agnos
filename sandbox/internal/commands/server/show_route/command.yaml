args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: show-route
    - description: the route (identifier or package name) to print
      end: 1
      id: Name
      required: true
      start: 1
category: Server
description: 'Reads the route''s route.yaml, in whatever folder of sandbox/internal/routes it sits, and prints it as a tree: the request line the route answers, then every place the declaration holds something — its paths, its parameters and the json-schema of its body, property by property with the keywords declared on each. It is the one command of the route surface that writes nothing and runs no build.'
examples:
    - show-route create-user
priority: 100
summary: Print one route's whole declaration as a tree
