args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: rename-route
    - description: the route to rename (identifier or package name)
      end: 1
      id: Route
      required: true
      start: 1
    - description: the name it takes on
      end: 2
      id: Name
      required: true
      start: 2
category: Server
description: 'Moves the route''s directory to <name>/ in the folder it sits in — or in the one --dir names, / for the top — rewriting the package clause of every hand-written Go file, drops every folder that leaves empty, and runs build so new.go, input.go and the server''s route list follow it. <name> may be the current one when only the folder changes. A page is refused: remove-page and add-page own its html.'
flags:
    - description: the folder under sandbox/internal/routes the route moves to, / for the top (defaults to the folder it sits in)
      id: Dir
priority: 100
summary: Rename one route
