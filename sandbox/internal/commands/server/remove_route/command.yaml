args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: remove-route
    - description: the route to delete (identifier or package name)
      end: 1
      id: Name
      required: true
      start: 1
category: Server
description: 'Removes the route''s directory whole, in whatever folder of sandbox/internal/routes it sits, and every folder that leaves empty, then re-renders the dispatch. A directory holding another route is refused. The build renders only: dropping a route may leave hand-written code referring to what is gone.'
examples:
    - remove-route create-user
priority: 100
summary: Delete one declared route
