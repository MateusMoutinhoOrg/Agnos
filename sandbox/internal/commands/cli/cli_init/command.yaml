args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: cli-init
category: Cli
description: |
    Installs the stddeps, argvdeps and stringsdeps deps the CLI layer depends on, renders the
    "cli" asset group into the project, and calls build.
examples:
    - cli-init
    - cli-init --path ./my-project
priority: 100
summary: Initialize the CLI layer for the project
