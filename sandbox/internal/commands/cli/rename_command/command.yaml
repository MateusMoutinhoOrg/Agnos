args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: rename-command
    - description: the command to rename (its name or a verb it answers to)
      end: 1
      id: Target
      required: true
      start: 1
    - description: the name it takes on
      end: 2
      id: Name
      required: true
      start: 2
category: Cli System
flags:
    - description: the folder under sandbox/internal/commands the command moves to, / for the top (defaults to the folder it sits in)
      id: Dir
help: 'Rename a command: its package, and the verb it answered to by its name'
long-description: Moves the command's directory to <name>/ in the folder it sits in — or in the one --dir names, / for the top — rewriting the package clause of every hand-written Go file and pointing the verb at the new name when it was the old one, drops every folder that leaves empty, and runs build so new.go, entries.go and the dispatch follow it. <name> may be the current one when only the folder changes. help, version and help-flag are generated and refused.
priority: 100
