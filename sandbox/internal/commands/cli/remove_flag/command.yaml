args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: remove-flag
    - description: the flag name, its id, or one of its keys, e.g. --out
      end: 1
      id: Name
      required: true
      start: 1
category: Cli
description: Drops one flag declaration (matched by its name, its id or one of its keys) from sandbox/internal/commands/<command>/command.yaml and runs build so the command's generated.new.go and generated.input.go follow it.
examples:
    - remove-flag output --command exec
    - remove-flag out --command exec
flags:
    - description: the command (a verb or its package name) that owns the flag
      id: Command
      keys:
        - --command
        - -c
      required: true
priority: 100
summary: Remove a flag from a command's command.yaml
