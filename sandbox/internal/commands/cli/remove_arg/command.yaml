args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: remove-arg
    - description: the arg name
      end: 1
      id: Name
      required: true
      start: 1
category: Cli
description: Drops one arg declaration from sandbox/internal/commands/<command>/command.yaml and runs build so the command's new.go and input.go follow it.
examples:
    - remove-arg file --command exec
flags:
    - description: the command (a verb or its package name) that owns the arg
      id: Command
      keys:
        - --command
        - -c
      required: true
priority: 100
summary: Remove an arg from a command's command.yaml
