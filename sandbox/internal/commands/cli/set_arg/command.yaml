args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: set-arg
    - description: the arg to rewrite (its name or id)
      end: 1
      id: Name
      required: true
      start: 1
category: Cli
flags:
    - description: the command (a verb or its package name) that declares the arg
      id: Command
      keys:
        - --command
        - -c
      required: true
    - description: the name the arg takes on
      id: Rename
    - description: the first segment the arg reads
      id: Start
    - description: the last segment the arg reads, -1 for the last one
      id: End
    - description: 'what one segment converts to: string, integer, number or uuid'
      id: Type
    - description: a command line matching the command without the arg is a usage error
      id: Required
      type: boolean
    - description: the literal bound when the arg is absent
      id: Default
    - description: what the segments have to read as for the command to run
      id: Trigger
    - description: 'how the trigger is compared: equal, prefix, text-prefix, suffix, regex or one-of'
      id: TriggerType
    - description: invert the trigger
      id: TriggerNegate
      type: boolean
    - description: compare the trigger without regard to case
      id: TriggerIgnoreCase
      type: boolean
    - description: the one-line help text
      id: Description
    - description: 'a key to take off: trigger, trigger-negate, trigger-ignore-case, type, required, default or description (repeatable)'
      id: Clear
      type: string-array
priority: 100
summary: Rewrite one arg of a command's command.yaml
