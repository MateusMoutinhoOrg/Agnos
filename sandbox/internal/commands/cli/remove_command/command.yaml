args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: remove-command
    - description: the command to delete (a verb or its package name)
      end: 1
      id: Name
      required: true
      start: 1
category: Cli
description: Deletes the command's directory, in whatever folder of sandbox/internal/commands it sits (command.yaml, new.go, input.go, handler.go and anything else in it), and every folder that leaves empty, then runs build so the dispatch stops running it. A directory holding another command is refused, and so are help, version and help-flag, which are generated.
examples:
    - remove-command my-feature
    - remove-command my-feature --path ./my-project
priority: 100
summary: Delete a command package from the project
