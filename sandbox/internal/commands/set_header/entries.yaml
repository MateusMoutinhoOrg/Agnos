args:
    - description: the header to edit, by the name it is declared under
      examples:
        - set-header authorization --route create-user --required
      name: name
      required: true
      type: string
category: Server System
examples:
    - set-header authorization --route create-user --required --description 'the bearer token'
flags:
    - description: the route (identifier or package name) the header is declared on
      examples:
        - set-header authorization --route create-user
      identifiers:
        - --route
      name: route
      required: true
      type: string
    - description: the header name it answers to from now on
      examples:
        - set-header authorization --route create-user --rename x-api-key
      identifiers:
        - --rename
      name: rename
      type: string
    - description: 'the value type: string, boolean, int or float'
      examples:
        - set-header retries --route create-user --type int
      identifiers:
        - --type
      name: type
      type: string
    - description: help text shown for the header
      examples:
        - set-header authorization --route create-user --description 'the bearer token'
      identifiers:
        - --description
      name: description
      type: string
    - description: the literal bound when the header is absent
      examples:
        - set-header accept-language --route create-user --default en
      identifiers:
        - --default
      name: default
      type: string
    - description: refuse a request that does not carry the header
      examples:
        - set-header authorization --route create-user --required
      identifiers:
        - --required
      name: required
      type: boolean
    - description: smallest accepted value (int/float only)
      examples:
        - set-header retries --route create-user --type int --min 0
      identifiers:
        - --min
      name: min
      type: string
    - description: largest accepted value (int/float only)
      examples:
        - set-header retries --route create-user --type int --max 5
      identifiers:
        - --max
      name: max
      type: string
    - array: true
      description: a value the header takes, for the docs (repeatable; appended)
      examples:
        - set-header authorization --route create-user --example 'Bearer abc'
      identifiers:
        - --example
      name: example
      type: string
    - array: true
      description: 'a key to take off again: description, examples, default, required, min or max (repeatable)'
      examples:
        - set-header accept-language --route create-user --clear default
      identifiers:
        - --clear
      name: clear
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
    - description: match only when the request brings exactly this value, putting the field into what the route matches on
      examples:
        - set-header authorization --route admin --identifier 'Bearer root'
      identifiers:
        - --identifier
      name: identifier
      type: string
    - description: match only when the value the request brings begins with this, putting the field into what the route matches on
      examples:
        - set-header authorization --route admin --starts-with Bearer
      identifiers:
        - --starts-with
      name: starts-with
      type: string
help: Rewrite one declared request header of a route
identifiers:
    - set-header
long-description: 'Rewrites one declared header in place and runs build. It is add-header applied to a declaration that already exists: the keys given are written over the ones there, --clear takes one off, and the result goes through the same constructor — so adding a bound that was forgotten never means removing the header and declaring it again.'
