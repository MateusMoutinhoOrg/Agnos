args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: publish
category: Core Commands
flags:
    - description: The name of the release
      id: ReleaseName
      keys:
        - --release-name
        - -rn
    - description: Create a draft release
      id: Draft
      type: boolean
    - default: all
      description: a target to compile and publish (repeatable); one of linux86, linuxarm64, linuxi32, mac86, macarm64, windows86, windowsi32, or all
      id: Target
      keys:
        - --target
        - -t
      type: string-array
    - default: gh
      description: The publisher to use (defaults to gh)
      id: Publisher
      keys:
        - --publisher
        - -pub
help: Builds, compiles and publishes a release via gh
long-description: Runs build, then compile (every target by default, or each --target given), and publishes the binaries that compile wrote as a gh release named --release-name, defaulting to the version in AgnosConfig/project.yaml. A project with no version and no --release-name is refused.
priority: 100
