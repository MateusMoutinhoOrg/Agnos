args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: verify
category: Core
description: 'Verifies the structural rules the harness depends on: sandbox/ imports stay inside sandbox/, sandbox/ holds only api, deps, internal and generated.new.go, sandbox/api imports nothing but sandbox/deps and sandbox/deps imports nothing external, every sandbox/api file has the sandbox/internal/<x>/ package whose New<X> builds it, every generated.*.go opens with its Code generated header, and adapters/ holds only bindings and libs. `agnos build` runs this as a gate unless --unsafe is passed.'
examples:
    - verify
flags:
    - default: go
      description: 'the toolchain the project is handed to after the schema check: go (tidy + compile) or none'
      id: Runtime
priority: 100
summary: Check the project keeps the sandbox/adapter schema
