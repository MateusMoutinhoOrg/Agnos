args:
    - end: 0
      id: Verb
      start: 0
      trigger:
        type: equal
        value: build
category: Core
description: |
    Re-renders every generated file of the project in the given
    directory, then hands the result to the runtime named by
    --runtime ("go" resolves the module graph and compiles every
    package, "none" renders only). If no path is provided, the
    current directory is used.
examples:
    - build
    - build --path ./my-project
    - build -q
flags:
    - default: go
      description: 'the toolchain the rendered project is handed to: go (tidy + compile) or none'
      id: Runtime
    - description: Skips the verify schema gate before building
      id: Unsafe
      type: boolean
priority: 100
summary: Build the project in a directory
