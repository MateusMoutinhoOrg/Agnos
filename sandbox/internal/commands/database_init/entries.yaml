category: Database System
examples:
    - database-init
    - database-init --path ./my-project
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Add the database layer to the project
identifiers:
    - database-init
long-description: 'Installs the store the database layer is built over as a remote dep under sandbox/deps/database, renders sandbox/internal/generated/databaseio and turns the sandbox-database mechanic on. It scaffolds no database of its own: which tables a project wants is a declaration, so ''agnos add-database'' is the step that follows.'
