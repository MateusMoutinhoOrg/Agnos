identifiers: ["cli-purge"]
category: Cli System
help: Removes the CLI layer from the project
long-description: |
  Removes every file the "cli" asset group installs and calls build.
examples:
  - "cli-purge"
  - "cli-purge --path ./my-project"
flags:
  path:
    identifiers: ["--path"]
    description: the dir holding the project (defaults to the current directory)
    examples:
      - "cli-purge --path ./my-project"
    type: string
    default: "."
  quiet:
    identifiers: ["--quiet", "-q"]
    description: Quiets the cli output
    examples:
      - "cli-purge -q"
    type: boolean
