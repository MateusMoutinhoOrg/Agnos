args:
    - description: the key of the parameter to drop
      examples:
        - remove-parameter page --route list-users
      name: name
      required: true
      type: string
category: Server System
examples:
    - remove-parameter page --route list-users
flags:
    - description: the route (identifier or package name) that declares the parameter
      examples:
        - remove-parameter page --route list-users
      identifiers:
        - --route
      name: route
      required: true
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - remove-parameter page --route list-users --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Delete one entry of a route's parameters
identifiers:
    - remove-parameter
long-description: 'Drops one entry of the route''s parameters, the exact inverse of add-parameter. The build renders only: dropping a parameter may leave hand-written code reading an Entries field that is gone.'
