category: Front System
examples:
    - front-purge
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Remove the html front layer from the project
identifiers:
    - front-purge
long-description: 'Removes sandbox/internal/frontio and the frontend route, then rebuilds. assets/frontend/ is left untouched: every file there is the project''s content, so front-init puts the route back over it.'
