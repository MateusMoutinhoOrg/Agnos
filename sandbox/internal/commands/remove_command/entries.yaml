args:
    - description: the command to delete (identifier or package name)
      examples:
        - remove-command my-feature
      name: name
      required: true
      type: string
category: Cli System
examples:
    - remove-command my-feature
    - remove-command my-feature --path ./my-project
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - remove-command my-feature --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Delete a command package from the project
identifiers:
    - remove-command
long-description: |-
    Deletes sandbox/internal/commands/<name>/ (entries.yaml, new.go, handler.go
    and anything else inside) and runs build so the dispatch and help stop
    answering to it. The generated help command cannot be removed.
