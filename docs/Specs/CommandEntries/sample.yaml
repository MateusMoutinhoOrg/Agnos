# This file is an illustrative sample, not part of the build.
identifiers: ["greet", "hello"]
category: Demo
help: Say hello
long-description: |
  Greets someone, as many times as asked. The name is required; the
  count defaults to one and must be at least one.
examples:
  - "greet -n bob"
  - "greet -n bob 3 --quiet"
args:
  - name: times
    type: int
    default: "1"
    min: 1
    description: how many times
flags:
  - name: name
    identifiers: ["--name", "-n"]
    type: string
    required: true
    description: who to greet
    examples:
      - "--name bob"
  - name: quiet
    identifiers: ["--quiet", "-q"]
    type: boolean
    description: Quiets the cli output
