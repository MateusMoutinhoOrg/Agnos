AgnosConfig:
  order: 1
  dir: true
  description: written once by `start`, read by every `build`
  children:
    project.yaml:
      order: 1
      description: project-name, version, description  (projectconf)
    themes.yaml:
      order: 2
      description: "doc themes: name, id, description  (themesconf)"
    structure.yaml:
      order: 3
      description: this tree  (structureconf)
    extensions.yaml:
      order: 4
      description: which mechanics agnos generates  (extensionsconf)
    paths.yaml:
      order: 5
      description: StagedFS listing rewrites  (pathsconf)
    docs/ReadmeHeader.md:
      order: 6
      description: README body, a template
sandbox:
  order: 2
  dir: true
  description: "closed: imports nothing outside sandbox/, no OS packages"
  children:
    new.go:
      order: 1
      gen: true
      description: New(deps) *api.Sandbox, one <x>.Constructor(&self) per constructors/ dir
    api:
      order: 2
      dir: true
      description: contracts only; imports nothing but sandbox/deps, for Sandbox.Deps, and the OpinionatedAgnos<X> contracts it aliases
      children:
        sandbox.go:
          order: 1
          gen: true
          description: Sandbox struct, one field per api/ file
        actions.go:
          order: 2
          description: Actions struct + props structs + Runtime consts
        cli.go:
          order: 3
          gen: true
          description: Cli + exit consts, aliases of the OpinionatedAgnosCli contract
        command.go:
          order: 4
          gen: true
          description: Command/CommandFlag/CommandArg/CommandResponse/CommandFailure, aliases of the OpinionatedAgnosCli contract
        config.go:
          order: 5
          gen: true
          description: Config struct, the project's own name and version
        trigger.go:
          order: 6
          gen: true
          description: Trigger/TriggerType, the condition a route and a command match on; aliases of the OpinionatedAgnosCli contract
    constructors:
      order: 3
      dir: true
      description: one <x>/constructor.go per field of the Sandbox; written once, then yours
      children:
        <x>/constructor.go:
          order: 1
          description: "Constructor(sandbox): sandbox.<X> = <x>.New<X>(sandbox)"
    deps:
      order: 4
      dir: true
      description: contracts; each <x>/ imports nothing at all, an OpinionatedAgnos<X>/ nothing but other contracts
      children:
        deps.go:
          order: 1
          gen: true
          description: Deps struct, one <Field> <dir>.Contract per dir
        <x>/<x>.go:
          order: 2
          description: type Sandbox struct of func fields
        OpinionatedAgnosCli/opinionatedagnoscli.go:
          order: 3
          description: "the cli lib: the command declaration types, MainProps, and Main, NewCommand, BindCommand, Fail, FailureOf, MatchTrigger"
    internal:
      order: 5
      dir: true
      description: the logic; unreachable from outside the sandbox
      children:
        generated:
          order: 1
          dir: true
          gen: true
          description: every package the build rewrites whole — the registries and config; never edited by hand
          children:
            config/new.go:
              order: 1
              gen: true
              description: "NewConfig(sandbox) api.Config: ProjectName, Version"
            cli/new.go:
              order: 2
              gen: true
              description: "NewCli(sandbox) api.Cli: Cli.Commands in run order + Cli.Fail + Cli.Main, which hands the line to Deps.OpinionatedAgnosCli.Main"
        commands/<name>:
          order: 4
          dir: true
          description: command.yaml (decl), new.go + input.go (gen), handler.go (hand); under the folder of its category (core/, cli/, server/, middleware/, …) — the command.yaml is what makes a dir a command
        actions/new.go:
          order: 5
          description: "NewActions(sandbox) api.Actions: one assignment per action"
        actions/<name>:
          order: 6
          dir: true
          description: <name>.go (opens StagedFS, persists, follow-up build) + <name>_internal.go (logic on an open StagedFS)
        actions/build/collect_*.go:
          order: 7
          description: "collectors: list one dir, title-case names"
        actions/build/generate_*.go:
          order: 8
          description: new.go + input.go per command and per route, help's command.yaml, doc indexes
        actions/verify/check_*.go:
          order: 9
          description: one rule set per file, each returns []string
        declarations/<name>conf:
          order: 10
          dir: true
          description: api.go, new.go, new_empty.go, bind_methods.go, render.go
        apishape:
          order: 11
          dir: true
          description: the sandbox/api convertibility rule and the converter plan the remote-dep shim is generated from
        stagedfs:
          order: 12
          dir: true
          description: transactional fs rooted at --path
        utils:
          order: 13
          dir: true
          description: RenderGroup, RenderTemplateToDest, Load*Conf, CollectDocTree, FlattenStructure, GoIdentifier, command.yaml and route.yaml field helpers
adapters:
  order: 3
  dir: true
  description: the only place OS-bound and third-party code lives
  children:
    impls/<adapter>/<adapter>.go:
      order: 1
      description: one package per adapter, exports Bind(deps *deps.Deps)
    impls/<adapter>/adapter.yaml:
      order: 2
      description: which dep the adapter fills, which module it pins  (adapterconf)
    impls/OpinionatedAgnosCli:
      order: 3
      dir: true
      description: "the cli lib: the dispatch chain, binder, matcher and trigger every command runs through, over the stdlib"
    bindings/<name>/binding.yaml:
      order: 4
      description: which adapters this binding binds, one per Deps field  (bindingconf)
    bindings/<name>/new.go:
      order: 5
      gen: true
      description: New() deps.Deps calling the Bind of every adapter declared; a binding with no binding.yaml is hand-written and left alone
assets:
  order: 4
  dir: true
  description: Go text/templates embedded by asset.go; never `go build ./...`
  children:
    start:
      order: 1
      dir: true
      description: written once, on `start`
    sandbox:
      order: 2
      dir: true
      description: "rendered when the `sandbox` extension is on; one group per extension from here down"
    deps:
      order: 3
      dir: true
      description: rendered when `deps` is on
    cli:
      order: 4
      dir: true
      description: rendered when `cli` is on
    server:
      order: 5
      dir: true
      description: rendered when `server` is on
    readme:
      order: 6
      dir: true
      description: rendered when `readme` is on
    doc:
      order: 7
      dir: true
      description: rendered when `doc` is on
    doc-<x>:
      order: 8
      dir: true
      description: "rendered when `doc` and every `<x>` it names are on (doc-cli, doc-server, doc-front, doc-database, doc-backoffice, doc-example, doc-example-cli)"
    dep-catalog/<dep>:
      order: 9
      dir: true
      description: one installable contract, dep.yaml beside the target layout it mirrors; dep-catalog/OpinionatedAgnos<X> are the opinionated libs, one per mechanic with code (Cli, Server, Front, Database)
    adapter-catalog/<adapter>:
      order: 10
      dir: true
      description: one installable adapter, adapter.yaml beside the target layout it mirrors
    templates:
      order: 11
      dir: true
      description: single-file scaffolds (command_*, route_*, database_*, front_*, start_server_*, server_handle_*, cli_handle_*, help_command.yaml, doc_page.md, doc_index.md)
    templates/backoffice:
      order: 12
      dir: true
      description: the tree backoffice-init writes once, at the path each file holds in it; assets/ under it is copied verbatim
cmd/main/main.go:
  order: 5
  gen: true
  description: standard.New() -> sandbox.New -> Main(os.Args[1:])
docs:
  order: 6
  dir: true
  description: one dir per doc, holding doc.md + doc.yaml (+ assets, + sub-docs). README.md indexes them all
  children:
    "**/Index.md":
      gen: true
      description: written for every doc that has sub-docs
    "Commands/<command>.md":
      gen: true
      description: one page per visible command, indexed by docs/Commands/doc.md
    "PublicApi/<contract>.md":
      gen: true
      description: one page per file of sandbox/api and per contract of sandbox/deps, indexed by docs/PublicApi/doc.md
examples:
  order: 7
  dir: true
  description: one dir per example; `run-examples` runs each and diffs it against its golden
  children:
    cli/<name>/example.sh:
      order: 1
      description: the example, run with `sh` and its own dir as cwd
    lib/<name>/example.go:
      order: 2
      description: the example, run with `go run` and its own dir as cwd
    <side>/<name>/result.yaml:
      order: 3
      gen: true
      description: "golden: cli-output, exit-code, sha256 of every assert-dir file"
    <side>/<name>/test-dir:
      order: 4
      dir: true
      description: the only place an example writes; removed before every run
    <side>/<name>/assert-dir:
      order: 5
      dir: true
      description: what the example copied out of test-dir to assert; the golden's tree
release:
  order: 8
  dir: true
  description: git-ignored binaries, and the run-examples cli alias
