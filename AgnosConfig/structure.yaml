AgnosConfig:
  order: 1
  dir: true
  description: written once by `start`, read by every `build`
  children:
    project.yaml:
      order: 1
      description: name, version, description  (projectconf)
    themes.yaml:
      order: 2
      description: "doc themes: name, id, description  (themesconf)"
    structure.yaml:
      order: 3
      description: this tree  (structureconf)
    extensions.yaml:
      order: 4
      description: which mechanics agnos generates  (extensionsconf)
    paths.yaml:
      order: 5
      description: SmartIO listing rewrites  (pathreplacerconf)
    docs/ReadmeHeader.md:
      order: 6
      description: README body, a template
sandbox:
  order: 2
  dir: true
  description: "closed: imports nothing outside sandbox/, no OS packages"
  children:
    new.go:
      order: 1
      gen: true
      description: New(deps) *api.Sandbox, one <x>.New<X> per api/ file
    api:
      order: 2
      dir: true
      description: contracts only; imports nothing but sandbox/deps, for Sandbox.Deps
      children:
        sandbox.go:
          order: 1
          gen: true
          description: Sandbox struct, one field per api/ file
        actions.go:
          order: 2
          description: Actions struct + props structs + Runtime consts
        cli.go:
          order: 3
          gen: true
          description: Cli struct + exit consts
        command.go:
          order: 4
          gen: true
          description: Command/CommandFlag/CommandArg + NewCommand
    deps:
      order: 3
      dir: true
      description: contracts; each <x>/ imports nothing at all
      children:
        deps.go:
          order: 1
          gen: true
          description: Deps struct, one <Title> <dir>.Sandbox per dir
        <x>/<x>.go:
          order: 2
          description: type Sandbox struct of func fields
    internal:
      order: 4
      dir: true
      description: the logic; unreachable from outside the sandbox
      children:
        config/config.go:
          order: 1
          gen: true
          description: ProjectName, Version
        cli/new.go:
          order: 2
          gen: true
          description: "NewCli(sandbox) api.Cli: Cli.Commands + Cli.CliMain"
        cli/climain.go:
          order: 3
          gen: true
          description: CliMain, the one dispatch, read off Cli.Commands
        commands/<name>:
          order: 4
          dir: true
          description: entries.yaml (decl), new.go (gen), handler.go (hand)
        actions/new.go:
          order: 5
          description: "NewActions(sandbox) api.Actions: one assignment per action"
        actions/<name>:
          order: 6
          dir: true
          description: <name>.go (opens SmartIO, persists, follow-up build) + <name>_internal.go (logic on an open SmartIO)
        actions/build/collect_*.go:
          order: 7
          description: "collectors: list one dir, title-case names"
        actions/build/generate_*.go:
          order: 8
          description: new.go per command and per route, help entries.yaml, doc indexes
        actions/verify/check_*.go:
          order: 9
          description: one rule set per file, each returns []string
        parsables/<name>conf:
          order: 10
          dir: true
          description: api.go, new.go, new_empty.go, bind_methods.go, render.go
        apishape:
          order: 11
          dir: true
          description: the sandbox/api convertibility rule and the converter plan the remote-dep shim is generated from
        smartio:
          order: 12
          dir: true
          description: transactional fs rooted at --path
        utils:
          order: 13
          dir: true
          description: RenderGroup, RenderTemplateToDest, Load*Conf, CollectDocTree, FlattenStructure, entries.yaml field helpers
adapters:
  order: 3
  dir: true
  description: the only place OS-bound and third-party code lives
  children:
    libs/<adapter>/<adapter>.go:
      order: 1
      description: one package per adapter, exports Bind(deps *deps.Deps)
    libs/<adapter>/adapter.yaml:
      order: 2
      description: which dep the adapter fills, which module it pins  (adapterconf)
    availables/<name>/available.yaml:
      order: 3
      description: which adapters this available binds, one per Deps field  (availableconf)
    availables/<name>/new.go:
      order: 4
      gen: true
      description: New() deps.Deps calling the Bind of every adapter declared; an available with no available.yaml is hand-written and left alone
assets:
  order: 4
  dir: true
  description: Go text/templates embedded by asset.go; never `go build ./...`
  children:
    start:
      order: 1
      dir: true
      description: written once, on `start`
    sandbox:
      order: 2
      dir: true
      description: "rendered when the `sandbox` extension is on; one group per extension from here down"
    sandbox-deps:
      order: 3
      dir: true
      description: rendered when `sandbox-deps` is on
    sandbox-cli:
      order: 4
      dir: true
      description: rendered when `sandbox-cli` is on
    sandbox-server:
      order: 5
      dir: true
      description: rendered when `sandbox-server` is on
    sandbox-front:
      order: 6
      dir: true
      description: rendered when `sandbox-front` is on
    readme:
      order: 7
      dir: true
      description: rendered when `readme` is on
    doc:
      order: 8
      dir: true
      description: rendered when `doc` is on
    doc-<x>:
      order: 9
      dir: true
      description: "rendered when `doc` and every `sandbox-<x>` it names are on (doc-cli, doc-server, doc-front, doc-example, doc-example-cli)"
    deplist/<dep>:
      order: 10
      dir: true
      description: one installable contract, dep.yaml beside the target layout it mirrors
    adapterlist/<adapter>:
      order: 11
      dir: true
      description: one installable adapter, adapter.yaml beside the target layout it mirrors
    templates:
      order: 12
      dir: true
      description: single-file scaffolds (new.go, command_*, route_*, page_*, static_*, front_main.*, start_server_*, help_entries.yaml, doc_doc.md, *_index.md)
cmd/main/main.go:
  order: 5
  gen: true
  description: standard.New() -> sandbox.New -> CliMain(os.Args[1:])
docs:
  order: 6
  dir: true
  description: one dir per doc, holding doc.md + props.yaml (+ assets, + sub-docs). README.md indexes them all
  children:
    "**/Index.md":
      gen: true
      description: written for every doc that has sub-docs
examples:
  order: 7
  dir: true
  description: one dir per example; `exec-test` runs each and diffs it against its golden
  children:
    cli/<name>/example.sh:
      order: 1
      description: the example, run with `sh` and its own dir as cwd
    lib/<name>/example.go:
      order: 2
      description: the example, run with `go run` and its own dir as cwd
    <side>/<name>/result.yaml:
      order: 3
      gen: true
      description: "golden: cli-output, exit-code, sha256 of every AssertDir file"
    <side>/<name>/TestDir:
      order: 4
      dir: true
      description: the only place an example writes; removed before every run
    <side>/<name>/AssertDir:
      order: 5
      dir: true
      description: what the example copied out of TestDir to assert; the golden's tree
release:
  order: 8
  dir: true
  description: git-ignored binaries, and the exec-test cli alias
