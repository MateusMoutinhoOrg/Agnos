identifiers: ["build"]
category: Core Commands
help: Build the project in a directory
long-description: |
  Re-renders every generated file of the project in the given
  directory, then hands the result to the runtime named by
  --runtime ("go" resolves the module graph and compiles every
  package, "none" renders only). If no path is provided, the
  current directory is used.
examples:
  - "build"
  - "build --path ./my-project"
  - "build -q"
flags:
  - name: path
    identifiers: ["--path"]
    description: the dir holding the project (defaults to the current directory)
    examples:
      - "build --path ./my-project"
    type: string
    default: "."
  - name: quiet
    identifiers: ["--quiet", "-q"]
    description: Quiets the cli output
    examples:
      - "build -q"
    type: boolean
  - name: runtime
    identifiers: ["--runtime"]
    description: "the toolchain the rendered project is handed to: go (tidy + compile) or none"
    examples:
      - "build --runtime none"
    type: string
    default: "go"
  - name: unsafe
    identifiers: ["--unsafe"]
    description: Skips the verify schema gate before building
    examples:
      - "build --unsafe"
    type: boolean
