args:
    - description: the name of the new command (e.g. my-feature)
      examples:
        - add-command my-feature
      name: name
      required: true
      type: string
category: Cli System
examples:
    - add-command my-feature
    - add-command my-feature --path ./my-project
flags:
    - description: one-line help text for the new command
      examples:
        - add-command my-feature --help "does the thing" --category Misc
      identifiers:
        - --help
      name: help
      required: true
      type: string
    - description: the category the new command is grouped under in help output
      examples:
        - add-command my-feature --help "does the thing" --category Misc
      identifiers:
        - --category
      name: category
      required: true
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - add-command my-feature --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      examples:
        - add-command my-feature -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Scaffold a new command package in the project
identifiers:
    - add-command
long-description: |-
    Creates sandbox/internal/commands/<name>/ with a hand-written entries.yaml
    and a stub handler.go, then runs build so new.go and the dispatch pick it up.
    Refuses to overwrite an existing command.
