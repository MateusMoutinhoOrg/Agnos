category: Deps System
examples:
    - list-deps
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - list-deps --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      examples:
        - list-deps -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Lists the deps the embedded catalog can install
identifiers:
    - list-deps
long-description: 'One row per dep of the embedded catalog: the name, whether the project has the contract installed, the adapters filling it (or the catalog''s default-adapter when none is), and what it provides.'
