args:
    - description: the arg name
      examples:
        - remove-arg file --command exec
      name: name
      required: true
      type: string
category: Cli System
examples:
    - remove-arg file --command exec
flags:
    - description: the command (identifier or package name) that owns the arg
      examples:
        - --command exec
      identifiers:
        - --command
        - -c
      name: command
      required: true
      type: string
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - remove-arg file --command exec --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - description: Quiets the cli output
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Remove a positional arg from a command's entries.yaml
identifiers:
    - remove-arg
long-description: |-
    Drops one positional arg declaration from
    sandbox/internal/commands/<command>/entries.yaml and runs build so the
    command's new.go forgets it. Later args shift up.
