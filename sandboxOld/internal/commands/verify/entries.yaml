category: Core Commands
examples:
    - verify
flags:
    - default: .
      description: the dir holding the project (defaults to the current directory)
      examples:
        - verify --path ./my-project
      identifiers:
        - --path
      name: path
      type: string
    - default: go
      description: 'the toolchain the project is handed to after the schema check: go (tidy + compile) or none'
      examples:
        - verify --runtime none
      identifiers:
        - --runtime
      name: runtime
      type: string
    - description: Quiets the cli output
      examples:
        - verify -q
      identifiers:
        - --quiet
        - -q
      name: quiet
      type: boolean
help: Checks the project keeps the sandbox/adapter schema
identifiers:
    - verify
long-description: 'Verifies the structural rules the harness depends on: sandbox/ imports stay inside sandbox/, sandbox/ holds only api, deps, internal and new.go, sandbox/api imports nothing but sandbox/deps and sandbox/deps imports nothing external, every sandbox/api file has the sandbox/internal/<x>/new.go that builds it, and adapters/ holds only availables and libs. `agnos build` runs this as a gate unless --unsafe is passed.'
