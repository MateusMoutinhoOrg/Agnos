priority: 7
strict: false
args:
  - id: Verb
    start: 0
    end: -1
    trigger: { type: prefix, value: "" }
category: Middleware
summary: Refuse a command line whose databases are at another version
description: |-
  Runs in front of every command line but migrate-database, help and version,
  after --database is read, and answers none of them. It refuses one when a
  database's data is at an older version than its database.yaml declares —
  migrate-database is what brings it up — at a newer one, written by a newer
  build, or when a migration of it stopped half way. A database holding no data
  yet is stamped with the version it is declared at. It checks when the
  command starts, never again: stop a running server before migrating.
