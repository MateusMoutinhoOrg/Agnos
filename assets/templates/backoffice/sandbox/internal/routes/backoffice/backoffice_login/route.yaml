body:
    content-type: application/x-www-form-urlencoded
    form-schema:
        properties:
            password:
                maxLength: 1024
                type: string
            username:
                maxLength: 254
                type: string
        required:
            - password
            - username
        type: object
    max-bytes: 4096
    required: true
    type: form
category: Backoffice
description: The username field takes a username or an email. A match sets the session cookie and redirects to /admin/home; anything else answers the login page under a 401. Every attempt is counted before its password is checked. After 20 failed sign-ins from one client ip, or 10 on one account (its username and its email together) from the ips it was not signed in from in the last 30 days, in 15 minutes, every attempt is answered the login page under a 429 with Retry-After, its password unchecked, until the 15 minutes pass; an ip the account signed in from keeps 10 of its own. A body over 4 KiB, a username over 254 bytes or a password over 1024 is refused unchecked.
methods:
    - POST
paths:
    - end: 1
      id: AdminLogin
      start: 0
      trigger:
        type: equal
        value: /admin/login
priority: 100
private: true
response-type: text/html
segments: 2
summary: Signs a backoffice user in and sets the session cookie
