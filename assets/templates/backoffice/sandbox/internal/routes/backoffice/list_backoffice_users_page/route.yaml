category: Backoffice Users
methods:
    - GET
parameters:
    - description: matches the username or the email, case-insensitive
      sources:
        - query
      id: Search
      key: search
      type: string
    - description: root, viewer, or empty for every role
      sources:
        - query
      id: Role
      key: role
      type: string
    - default: "1"
      description: the page to show, counted from 1
      sources:
        - query
      id: Page
      key: page
      type: integer
    - default: "20"
      description: how many users a page shows, from 1 to 100
      sources:
        - query
      id: Limit
      key: limit
      type: integer
    - description: the outcome code of the last add, edit or remove
      sources:
        - query
      id: Notice
      key: notice
      type: string
paths:
    - end: 1
      id: AdminListBackofficeUsers
      start: 0
      trigger:
        type: equal
        value: /admin/list-backoffice-users
priority: 100
response-type: text/html
segments: 2
summary: Lists backoffice users, filtered and paginated
