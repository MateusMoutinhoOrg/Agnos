category: Middleware
methods:
    - ANY
parameters:
    - description: the session JWT set by POST /admin/login
      sources:
        - cookie
      id: AdminToken
      key: backoffice_session
      type: string
paths:
    - end: -1
      id: Admin
      start: 0
      trigger:
        type: prefix
        value: /admin
    - description: the login route is reachable without a session
      end: -1
      id: NotLogin
      start: 0
      trigger:
        negate: true
        type: equal
        value: /admin/login
priority: 10
response-type: text/html
summary: Requires a valid backoffice session on /admin, except /admin/login
