category: Middleware
description: Runs after backoffice-api-token-auth. A root user goes through; any other backoffice user is answered 403 in JSON.
methods:
    - ANY
paths:
    - end: -1
      id: ApiAdminRoot
      start: 0
      trigger:
        type: prefix
        value: /api/admin/root
priority: 11
response-type: application/json
summary: Lets only root users reach /api/admin/root
